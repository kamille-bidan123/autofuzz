<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#111827">
  <title>Autofuzz 控制台资源未构建</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0f172a;
      color: #e2e8f0;
    }
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at top, rgba(59, 130, 246, 0.18), transparent 34%),
        linear-gradient(180deg, #0f172a 0%, #111827 100%);
    }
    main {
      width: min(680px, calc(100vw - 32px));
      padding: 28px;
      border: 1px solid rgba(148, 163, 184, 0.22);
      border-radius: 8px;
      background: rgba(15, 23, 42, 0.9);
      box-shadow: 0 24px 60px rgba(15, 23, 42, 0.35);
    }
    h1 {
      margin: 0 0 12px;
      font-size: 28px;
      line-height: 1.2;
    }
    p {
      margin: 0 0 12px;
      line-height: 1.65;
      color: #cbd5e1;
    }
    code {
      padding: 2px 6px;
      border-radius: 6px;
      background: rgba(30, 41, 59, 0.95);
      color: #bfdbfe;
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
      font-size: 0.95em;
    }
    ul {
      margin: 16px 0 0;
      padding-left: 20px;
      color: #cbd5e1;
      line-height: 1.7;
    }
  </style>
</head>
<body>
  <main>
    <h1>Autofuzz 控制台资源未构建</h1>
    <p>当前二进制只嵌入了占位页，没有嵌入 Vue 控制台资源。</p>
    <p>请先在仓库根目录执行 <code>make web</code> 或 <code>make</code>，再重新编译 <code>autofuzz-web</code>。</p>
    <ul>
      <li>前端构建产物会生成到 <code>internal/webui/static/generated</code></li>
      <li>该目录是本地生成产物，默认不会提交到 Git</li>
      <li>完整控制台仍然通过 Go 的 <code>embed</code> 打进最终二进制</li>
    </ul>
  </main>
</body>
</html>
