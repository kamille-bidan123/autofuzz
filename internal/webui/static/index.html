<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Autofuzz 控制台</title>
  <link rel="stylesheet" href="/static/vendor/xterm.css">
  <script src="/static/vendor/xterm.min.js"></script>
  <script src="/static/vendor/xterm-addon-fit.min.js"></script>
  <style>
    :root {
      color-scheme: light;
      --ink: #17233d;
      --muted: #657089;
      --line: #dbe3f2;
      --panel: rgba(255,255,255,.92);
      --blue: #377cf6;
      --blue-soft: #eaf2ff;
      --orange: #f49a38;
      --orange-soft: #fff2df;
      --purple: #7b61df;
      --purple-soft: #f0ecff;
      --green: #25a86b;
      --red: #df4f5f;
      --shadow: 0 16px 42px rgba(49, 76, 126, .12);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 10% 0%, #dcecff 0, transparent 28%),
        radial-gradient(circle at 92% 12%, #fff0d6 0, transparent 25%),
        #f5f8fd;
    }
    .shell { width: min(1480px, calc(100% - 40px)); margin: 0 auto; padding: 34px 0 60px; }
    header { display: flex; align-items: center; justify-content: space-between; gap: 20px; margin-bottom: 24px; }
    .brand { display: flex; align-items: center; gap: 14px; }
    .logo {
      width: 54px; height: 54px; display: grid; place-items: center;
      border-radius: 17px; color: white; font-size: 27px;
      background: linear-gradient(145deg, #377cf6, #765de5); box-shadow: var(--shadow);
    }
    h1 { margin: 0; font-size: clamp(25px, 3vw, 38px); letter-spacing: -.03em; }
    .subtitle { margin: 4px 0 0; color: var(--muted); font-size: 14px; }
    .run-status { padding: 9px 14px; border-radius: 999px; background: white; border: 1px solid var(--line); color: var(--muted); font-weight: 700; }
    .run-status.running { color: var(--blue); background: var(--blue-soft); border-color: #bfd4ff; }
    .run-status.completed { color: var(--green); background: #e9f8f0; border-color: #bce8d0; }
    .run-status.failed { color: var(--red); background: #fff0f1; border-color: #ffc9cf; }
    .layout { display: grid; grid-template-columns: minmax(360px, 470px) minmax(0, 1fr); gap: 22px; align-items: start; }
    .panel { background: var(--panel); border: 1px solid rgba(207,218,237,.9); border-radius: 22px; box-shadow: var(--shadow); overflow: hidden; }
    .panel.form-panel { overflow: visible; }
    .panel.form-panel .panel-head { border-radius: 22px 22px 0 0; }
    .panel-head { padding: 20px 22px 15px; border-bottom: 1px solid var(--line); }
    .panel-head h2 { margin: 0 0 5px; font-size: 18px; }
    .panel-head p { margin: 0; color: var(--muted); font-size: 13px; line-height: 1.5; }
    form { padding: 20px 22px 24px; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px 13px; }
    .field { display: flex; flex-direction: column; gap: 7px; min-width: 0; }
    .field.full { grid-column: 1 / -1; }
    label { font-size: 12px; font-weight: 800; color: #44506a; }
    input, select {
      width: 100%; min-height: 40px; padding: 9px 11px;
      color: var(--ink); background: #fbfcff; border: 1px solid #cfd9ea;
      border-radius: 10px; outline: none; font: inherit; font-size: 13px;
      transition: border-color .15s, box-shadow .15s;
    }
    input:focus, select:focus { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(55,124,246,.12); }
    /* path picker */
    .path-picker { position: relative; }
    .path-picker input { padding-right: 32px; }
    .path-picker .pp-btn {
      position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
      background: none; border: none; cursor: pointer; font-size: 16px; color: var(--muted);
      padding: 4px; border-radius: 6px; display: flex; align-items: center; justify-content: center;
      min-height: unset; border-radius: 6px;
    }
    .path-picker .pp-btn:hover { color: var(--blue); background: var(--blue-soft); }
    .pp-dropdown {
      position: absolute; left: 0; right: 0; top: calc(100% + 4px); z-index: 9999;
      max-height: 280px; overflow-y: auto;
      background: white; border: 1px solid #cfd9ea; border-radius: 10px;
      box-shadow: 0 8px 24px rgba(49,76,126,.14);
      display: none;
    }
    .pp-dropdown.open { display: block; }
    .pp-current {
      padding: 7px 11px; font-size: 11px; color: var(--muted);
      border-bottom: 1px solid var(--line); cursor: pointer;
      display: flex; align-items: center; gap: 6px;
    }
    .pp-current:hover { background: var(--blue-soft); color: var(--blue); }
    .pp-item {
      padding: 8px 11px; font-size: 13px; cursor: pointer;
      display: flex; align-items: center; gap: 8px;
      border-bottom: 1px solid #f0f3f8;
    }
    .pp-item:last-child { border-bottom: none; }
    .pp-item:hover { background: var(--blue-soft); }
    .pp-item.selected { background: var(--blue-soft); }
    .pp-icon { width: 16px; text-align: center; flex-shrink: 0; }
    .pp-icon.dir { color: var(--blue); }
    .pp-icon.file { color: var(--muted); }
    .pp-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .pp-empty { padding: 12px; text-align: center; color: var(--muted); font-size: 12px; }
    .checks { grid-column: 1 / -1; display: flex; gap: 22px; padding-top: 3px; }
    .check { display: flex; flex-direction: row; align-items: center; gap: 8px; font-size: 13px; }
    .check input { width: 17px; min-height: 17px; margin: 0; }
    .actions { display: flex; gap: 10px; margin-top: 20px; }
    button {
      border: 0; border-radius: 11px; padding: 11px 17px; font: inherit; font-weight: 800;
      cursor: pointer; transition: transform .15s, opacity .15s;
    }
    button:hover:not(:disabled) { transform: translateY(-1px); }
    button:disabled { opacity: .45; cursor: not-allowed; }
    .primary { color: white; background: linear-gradient(135deg, #377cf6, #6964df); flex: 1; }
    .danger { color: var(--red); background: #fff0f1; }
    .debug { color: var(--purple); background: var(--purple-soft); }
    .notice { margin-top: 16px; padding: 11px 13px; border-radius: 11px; background: #fff8e8; color: #815e21; font-size: 12px; line-height: 1.55; }
    .content { display: grid; gap: 22px; min-width: 0; }
    .stages { padding: 20px; display: grid; grid-template-columns: repeat(4, minmax(125px, 1fr)); gap: 12px; }
    .stage {
      position: relative; min-height: 126px; padding: 14px; border-radius: 16px;
      border: 1px solid var(--line); background: #fbfcff; transition: .2s ease;
    }
    .stage::after { content: "›"; position: absolute; right: -11px; top: 43px; z-index: 2; color: #a8b4c9; font-size: 28px; font-weight: 900; }
    .stage:nth-child(4)::after, .stage:last-child::after { display: none; }
    .stage.running { border-color: #94b8ff; background: var(--blue-soft); box-shadow: 0 8px 20px rgba(55,124,246,.13); transform: translateY(-2px); }
    .stage.completed { border-color: #a9dfc2; background: #effaf4; }
    .stage.failed { border-color: #ffb6be; background: #fff2f3; }
    .stage-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
    .stage-index { width: 29px; height: 29px; display: grid; place-items: center; border-radius: 9px; background: #edf1f8; font-weight: 900; font-size: 13px; }
    .stage.completed .stage-index { background: var(--green); color: white; }
    .stage.failed .stage-index { background: var(--red); color: white; }
    .stage.running .stage-index { background: var(--blue); color: white; }
    .spinner { width: 18px; height: 18px; border: 3px solid #bfd3fa; border-top-color: var(--blue); border-radius: 50%; display: none; animation: spin .75s linear infinite; }
    .stage.running .spinner { display: block; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .stage-name { font-size: 14px; font-weight: 900; line-height: 1.35; }
    .stage-owner { display: inline-block; margin-top: 8px; font-size: 10px; font-weight: 800; color: var(--muted); }
    .stage[data-owner="Codex CLI"] .stage-owner { color: #ac620f; background: var(--orange-soft); border-radius: 999px; padding: 3px 7px; }
    .streams { display: grid; grid-template-columns: 1.15fr .85fr; min-height: 420px; }
    .stream { min-width: 0; }
    .stream + .stream { border-left: 1px solid var(--line); }
    .stream-title { display: flex; align-items: center; justify-content: space-between; padding: 14px 17px; border-bottom: 1px solid var(--line); }
    .stream-title h3 { margin: 0; font-size: 14px; }
    .stream-title span { color: var(--muted); font-size: 11px; }
    .event-list { height: 410px; overflow: auto; padding: 12px; background: #f9fbff; }
    .empty { height: 100%; display: grid; place-items: center; color: #98a3b7; font-size: 13px; text-align: center; padding: 30px; }
    .codex-event { margin-bottom: 9px; padding: 10px 11px; border-radius: 11px; background: white; border: 1px solid #eadcc8; font-size: 12px; }
    .codex-event summary { cursor: pointer; font-weight: 800; color: #8c561b; overflow-wrap: anywhere; }
    .codex-event pre { margin: 9px 0 0; padding: 9px; max-height: 240px; overflow: auto; border-radius: 8px; background: #172033; color: #dbe6ff; white-space: pre-wrap; overflow-wrap: anywhere; font-size: 10px; }
    .log-line { padding: 4px 3px; color: #33405a; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 10.5px; line-height: 1.45; overflow-wrap: anywhere; border-bottom: 1px dashed #e5eaf3; }
    .log-source { color: #7b61df; font-weight: 800; margin-right: 6px; }
    /* terminal log */
    #runtimeLogs.event-list:has(.xterm) { padding: 0; background: #1e1e2e; }
    #runtimeLogs .xterm { padding: 6px; }
    #runtimeLogs .xterm .xterm-viewport { background-color: #1e1e2e !important; }
    .meta { padding: 12px 20px; border-top: 1px solid var(--line); color: var(--muted); font-size: 12px; overflow-wrap: anywhere; }
    @media (max-width: 1100px) { .layout { grid-template-columns: 1fr; } .stages { grid-template-columns: repeat(4, 1fr); } }
    @media (max-width: 720px) { .shell { width: min(100% - 20px, 1480px); padding-top: 18px; } header { align-items: flex-start; } .form-grid, .streams { grid-template-columns: 1fr; } .stream + .stream { border-left: 0; border-top: 1px solid var(--line); } .stages { grid-template-columns: repeat(2, 1fr); } .stage:nth-child(2n)::after { display: none; } }
  </style>
</head>
<body>
<div class="shell">
  <header>
    <div class="brand">
      <div class="logo">⚙</div>
      <div><h1>Autofuzz 控制台</h1><p class="subtitle">从源码仓库到可验证 fuzz driver 的全自动流水线</p></div>
    </div>
    <div id="runStatus" class="run-status">未启动</div>
  </header>

  <div class="layout">
    <section class="panel form-panel">
      <div class="panel-head"><h2>运行配置</h2><p>配置项与 autofuzz CLI 一一对应。源码准备后会直接执行目标仓库构建代码。</p></div>
      <form id="runForm">
        <div class="form-grid">
          <div class="field full"><label for="repository_url">本地目录或 GitHub 链接 *</label><div class="path-picker"><input id="repository_url" required placeholder="/path/to/library 或 https://github.com/...git"><button type="button" class="pp-btn" tabindex="-1">📂</button><div class="pp-dropdown"></div></div></div>
          <div class="field"><label for="ref">Git ref / tag / branch</label><input id="ref" placeholder="可选"></div>
          <div class="field"><label for="workspace">工作目录</label><div class="path-picker"><input id="workspace" required><button type="button" class="pp-btn" tabindex="-1">📂</button><div class="pp-dropdown"></div></div></div>
          <div class="field full"><label for="promefuzz">PromeFuzz 路径</label><div class="path-picker"><input id="promefuzz" required><button type="button" class="pp-btn" tabindex="-1">📂</button><div class="pp-dropdown"></div></div></div>
          <div class="field full"><label for="config">PromeFuzz config.toml</label><div class="path-picker"><input id="config" required><button type="button" class="pp-btn" tabindex="-1">📂</button><div class="pp-dropdown"></div></div></div>
          <div class="field full"><label for="python">虚拟环境 Python</label><div class="path-picker"><input id="python" required><button type="button" class="pp-btn" tabindex="-1">📂</button><div class="pp-dropdown"></div></div></div>
          <div class="field"><label for="jobs">构建并行度</label><input id="jobs" type="number" min="1" required></div>
          <div class="field"><label for="pool_size">PromeFuzz 并发度</label><input id="pool_size" type="number" min="1" required></div>
          <div class="field full"><label for="stop_after">停止阶段</label><select id="stop_after"><option value="built">built</option><option value="configured">configured</option><option value="preprocessed">preprocessed</option><option value="comprehended">comprehended</option><option value="generated">generated</option><option value="fuzzing">fuzzing</option></select></div>
          <div class="field full"><label for="codex_command">Codex CLI 命令</label><div class="path-picker"><input id="codex_command" required><button type="button" class="pp-btn" tabindex="-1">📂</button><div class="pp-dropdown"></div></div></div>
          <div class="field"><label for="codex_model">Codex 模型</label><input id="codex_model" placeholder="留空使用默认值"></div>
          <div class="field"><label for="codex_profile">Codex profile</label><input id="codex_profile" placeholder="可选"></div>
          <div class="checks">
            <label class="check"><input id="resume" type="checkbox">从已有状态恢复</label>
            <label class="check"><input id="verbose" type="checkbox">服务端同步输出日志</label>
          </div>
        </div>
        <div class="actions"><button id="startButton" class="primary" type="submit">启动 Autofuzz</button><button id="cancelButton" class="danger" type="button" disabled>取消</button><button id="triggerFuzzButton" class="debug" type="button" disabled title="在 fuzzing 阶段手动触发 LLM 分析优化">🔬 触发分析</button></div>
        <div id="formMessage" class="notice">Web 服务默认仅监听本机。对于不可信仓库，请在一次性容器或隔离虚拟机中运行。</div>
      </form>
    </section>

    <main class="content">
      <section class="panel">
        <div class="panel-head"><h2>执行阶段</h2><p>旋转图标表示当前正在执行的阶段；橙色 Codex 阶段会产生结构化 JSON 事件。</p></div>
        <div id="stages" class="stages"></div>
        <div id="runMeta" class="meta">尚未创建任务</div>
      </section>

      <section class="panel streams">
        <div class="stream">
          <div class="stream-title"><h3>🤖 Codex CLI 实时事件</h3><span id="codexCount">0 条</span></div>
          <div id="codexEvents" class="event-list"><div class="empty">built / configured 阶段的<br>Codex JSONL 事件将在这里出现</div></div>
        </div>
        <div class="stream">
          <div class="stream-title"><h3>运行日志</h3><span id="logCount">0 行</span></div>
          <div id="runtimeLogs" class="event-list"><div class="empty">等待 Autofuzz 启动</div></div>
        </div>
      </section>
    </main>
  </div>
</div>

<script>
  const stageDefs = [
    ['cloned', '准备源码', 'Go'], ['built', '自主构建', 'Codex CLI'],
    ['configured', '生成 library.toml', 'Codex CLI'], ['preprocessed', 'API 预处理', 'PromeFuzz'],
    ['comprehended', 'API 理解', 'PromeFuzz + Codex'], ['generated', 'All-cover 全量生成', 'PromeFuzz + Codex'],
    ['fuzzing', '持续 Fuzz 测试', 'libFuzzer + Codex']
  ];
  let taskId = null;
  let eventSource = null;
  let codexCount = 0;
  let logCount = 0;

  const $ = id => document.getElementById(id);

  /* ===== xterm.js terminal for runtime logs ===== */
  let term = null;
  let termFit = null;

  function initTerminal() {
    const container = $('runtimeLogs');
    container.innerHTML = '';
    term = new Terminal({
      theme: {
        background: '#1e1e2e',
        foreground: '#cdd6f4',
        cursor: '#f5e0dc',
        selectionBackground: '#585b70',
      },
      fontFamily: 'ui-monospace, SFMono-Regular, Menlo, "Cascadia Code", monospace',
      fontSize: 11,
      lineHeight: 1.3,
      scrollback: 10000,
      convertEol: false,
      disableStdin: true,
      cursorBlink: false,
      cursorStyle: 'bar',
    });
    termFit = new FitAddon.FitAddon();
    term.loadAddon(termFit);
    term.open(container);
    try { termFit.fit(); } catch(e) {}
    term.writeln('\x1b[2m等待 Autofuzz 启动...\x1b[0m');
    window.addEventListener('resize', () => { try { termFit.fit(); } catch(e) {} });
  }
  function renderStages(stages) {
    const statuses = Object.fromEntries((stages || []).map(stage => [stage.id, stage.status]));
    $('stages').replaceChildren(...stageDefs.map(([id, name, owner], index) => {
      const card = document.createElement('div');
      card.className = 'stage ' + (statuses[id] || 'pending');
      card.dataset.stage = id; card.dataset.owner = owner;
      card.innerHTML = `<div class="stage-top"><span class="stage-index">${index + 1}</span><span class="spinner"></span></div><div class="stage-name"></div><span class="stage-owner"></span>`;
      card.querySelector('.stage-name').textContent = name;
      card.querySelector('.stage-owner').textContent = owner;
      return card;
    }));
  }

  function setStageStatus(id, status) {
    const card = document.querySelector(`[data-stage="${CSS.escape(id)}"]`);
    if (card) card.className = 'stage ' + status;
  }

  function setRunStatus(status, text) {
    const element = $('runStatus');
    element.className = 'run-status ' + (status || '');
    element.textContent = text;
  }

  function updateTriggerButton(stage, status) {
    const btn = $('triggerFuzzButton');
    if (stage === 'fuzzing' && status === 'running') {
      btn.disabled = false;
    } else {
      btn.disabled = true;
    }
  }

  function requestBody() {
    return {
      repository_url: $('repository_url').value.trim(), ref: $('ref').value.trim(),
      workspace: $('workspace').value.trim(), promefuzz: $('promefuzz').value.trim(),
      config: $('config').value.trim(), python: $('python').value.trim(),
      pool_size: Number($('pool_size').value), jobs: Number($('jobs').value),
      codex_command: $('codex_command').value.trim(),
      codex_model: $('codex_model').value.trim(), codex_profile: $('codex_profile').value.trim(),
      resume: $('resume').checked, verbose: $('verbose').checked, stop_after: $('stop_after').value
    };
  }

  function fillDefaults(defaults) {
    Object.entries(defaults).forEach(([key, value]) => {
      const element = $(key);
      if (!element) return;
      if (element.type === 'checkbox') element.checked = Boolean(value);
      else element.value = value ?? '';
    });
  }

  function clearStream(id, message) {
    if (id === 'runtimeLogs' && term) {
      term.reset();
      term.writeln(`\x1b[2m${message}\x1b[0m`);
      return;
    }
    const container = $(id); container.replaceChildren();
    const empty = document.createElement('div'); empty.className = 'empty'; empty.textContent = message;
    container.appendChild(empty);
  }

  function removeEmpty(container) { const empty = container.querySelector('.empty'); if (empty) empty.remove(); }
  function capChildren(container, max) { while (container.children.length > max) container.firstElementChild.remove(); }

  function codexSummary(data) {
    const item = data.item || {};
    if (item.type === 'command_execution') return `${data.type} · 命令：${item.command || ''} · ${item.status || ''}`;
    if (item.type === 'agent_message') return `${data.type} · ${String(item.text || '').slice(0, 180)}`;
    if (item.type === 'reasoning') return `${data.type} · ${String(item.text || '').slice(0, 180)}`;
    if (item.type) return `${data.type} · ${item.type}`;
    return data.type || 'Codex event';
  }

  function appendCodex(event) {
    const container = $('codexEvents'); removeEmpty(container);
    const details = document.createElement('details'); details.className = 'codex-event';
    const summary = document.createElement('summary'); summary.textContent = `[${event.stage}] ${codexSummary(event.data || {})}`;
    const pre = document.createElement('pre'); pre.textContent = JSON.stringify(event.data || {}, null, 2);
    details.append(summary, pre); container.appendChild(details); capChildren(container, 800);
    container.scrollTop = container.scrollHeight; codexCount++; $('codexCount').textContent = `${codexCount} 条`;
  }

  function appendLog(event) {
    if (!term) return;
    const source = `[${event.stage || '-'} · ${event.source || 'autofuzz'}]`;
    const msg = event.message || '';
    term.write(`\x1b[36m${source}\x1b[0m ${msg}\r\n`);
    logCount++;
    $('logCount').textContent = `${logCount} 行`;
  }

  function handleEvent(event) {
    if (event.kind === 'stage') {
      setStageStatus(event.stage, event.status);
      updateTriggerButton(event.stage, event.status);
      appendLog(event);
    } else if (event.kind === 'codex') {
      appendCodex(event);
    } else if (event.kind === 'log') {
      appendLog(event);
    } else if (event.kind === 'run') {
        appendLog(event);
        if (event.status === 'running') setRunStatus('running', '运行中');
        if (event.status === 'completed') finishUI('completed', '已完成');
        if (event.status === 'failed') finishUI('failed', '运行失败');
    }
  }

  function finishUI(status, label) {
    setRunStatus(status, label); $('startButton').disabled = false; $('cancelButton').disabled = true; $('triggerFuzzButton').disabled = true;
    if (eventSource) { eventSource.close(); eventSource = null; }
    if (taskId) refreshSnapshot();
  }

  async function refreshSnapshot() {
    const response = await fetch(`/api/runs/${encodeURIComponent(taskId)}`);
    if (!response.ok) return;
    const snapshot = await response.json(); renderStages(snapshot.stages);
    $('runMeta').textContent = `任务 ${snapshot.id} · workspace: ${snapshot.target_dir}${snapshot.error ? ' · 错误: ' + snapshot.error : ''}`;
  }

  function connectEvents(id) {
    if (eventSource) eventSource.close();
    eventSource = new EventSource(`/api/runs/${encodeURIComponent(id)}/events`);
    eventSource.addEventListener('autofuzz', message => handleEvent(JSON.parse(message.data)));
    eventSource.onerror = () => { if ($('runStatus').classList.contains('running')) $('formMessage').textContent = '事件流连接中断，浏览器会自动重连。'; };
  }

  $('runForm').addEventListener('submit', async event => {
    event.preventDefault();
    $('startButton').disabled = true; $('formMessage').textContent = '正在创建任务…';
    codexCount = 0; logCount = 0; $('codexCount').textContent = '0 条'; $('logCount').textContent = '0 行';
    clearStream('codexEvents', '等待 Codex CLI JSONL 事件'); clearStream('runtimeLogs', '等待运行日志'); renderStages([]);
    try {
      const response = await fetch('/api/runs', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(requestBody())});
      const result = await response.json();
      if (!response.ok) throw new Error(result.error || '任务创建失败');
      taskId = result.id; renderStages(result.stages); setRunStatus('running', '运行中');
      $('cancelButton').disabled = false; $('formMessage').textContent = `任务 ${taskId} 已启动`;
      $('runMeta').textContent = `任务 ${taskId} · workspace: ${result.target_dir}`; connectEvents(taskId);
    } catch (error) {
      $('startButton').disabled = false; setRunStatus('failed', '启动失败'); $('formMessage').textContent = error.message;
    }
  });

  $('cancelButton').addEventListener('click', async () => {
    if (!taskId) return;
    $('cancelButton').disabled = true; $('formMessage').textContent = '正在取消任务…';
    const response = await fetch(`/api/runs/${encodeURIComponent(taskId)}/cancel`, {method: 'POST'});
    const result = await response.json();
    if (!response.ok) { $('formMessage').textContent = result.error || '取消失败'; $('cancelButton').disabled = false; }
  });

  $('triggerFuzzButton').addEventListener('click', async () => {
    if (!taskId) return;
    $('triggerFuzzButton').disabled = true; $('formMessage').textContent = '正在触发 LLM 分析…';
    try {
      const response = await fetch(`/api/runs/${encodeURIComponent(taskId)}/trigger-fuzz`, {method: 'POST'});
      const result = await response.json();
      if (!response.ok) {
        $('formMessage').textContent = result.error || '触发失败';
        $('triggerFuzzButton').disabled = false;
      } else {
        $('formMessage').textContent = '已触发 LLM 分析，等待结果…';
      }
    } catch (error) {
      $('formMessage').textContent = '触发失败: ' + error.message;
      $('triggerFuzzButton').disabled = false;
    }
  });

  renderStages([]);
  initTerminal();
  fetch('/api/defaults').then(response => response.json()).then(fillDefaults).catch(error => { $('formMessage').textContent = '读取默认配置失败：' + error.message; });

  /* ===== Path Picker Component ===== */
  let ppCache = new Map();

  async function ppBrowse(path) {
    const params = new URLSearchParams();
    if (path) params.set('path', path);
    const url = '/api/browse' + (params.toString() ? '?' + params.toString() : '');
    if (ppCache.has(url)) return ppCache.get(url);
    const response = await fetch(url);
    if (!response.ok) throw new Error('browse failed');
    const data = await response.json();
    ppCache.set(url, data);
    setTimeout(() => ppCache.delete(url), 3000);
    return data;
  }

  function ppCloseAll(except) {
    document.querySelectorAll('.pp-dropdown.open').forEach(dd => {
      if (dd !== except) dd.classList.remove('open');
    });
  }

  function ppRenderDropdown(dropdown, data, inputEl) {
    dropdown.innerHTML = '';
    // Current path header
    const current = document.createElement('div');
    current.className = 'pp-current';
    current.innerHTML = `<span>📁</span><span>${escapeHtml(data.path)}</span>`;
    current.addEventListener('click', () => {
      inputEl.value = data.path;
      inputEl.dispatchEvent(new Event('input'));
      dropdown.classList.remove('open');
    });
    dropdown.appendChild(current);

    if (!data.entries || data.entries.length === 0) {
      const empty = document.createElement('div');
      empty.className = 'pp-empty';
      empty.textContent = '空目录';
      dropdown.appendChild(empty);
      return;
    }

    const currentValue = inputEl.value.trim();
    data.entries.forEach(entry => {
      const item = document.createElement('div');
      item.className = 'pp-item';
      if (entry.path === currentValue) item.classList.add('selected');
      const icon = document.createElement('span');
      icon.className = 'pp-icon ' + (entry.is_dir ? 'dir' : 'file');
      icon.textContent = entry.is_dir ? '📁' : '📄';
      const name = document.createElement('span');
      name.className = 'pp-name';
      name.textContent = entry.name;
      item.append(icon, name);
      item.addEventListener('click', () => {
        inputEl.value = entry.path;
        inputEl.dispatchEvent(new Event('input'));
        if (entry.is_dir) {
          ppOpen(inputEl, dropdown, entry.path);
        } else {
          dropdown.classList.remove('open');
        }
      });
      item.addEventListener('dblclick', () => {
        if (entry.is_dir) {
          ppOpen(inputEl, dropdown, entry.path);
        }
      });
      dropdown.appendChild(item);
    });
  }

  async function ppOpen(inputEl, dropdown, path) {
    dropdown.classList.add('open');
    ppCloseAll(dropdown);
    try {
      const data = await ppBrowse(path || inputEl.value || '');
      ppRenderDropdown(dropdown, data, inputEl);
    } catch (e) {
      dropdown.innerHTML = '<div class="pp-empty">无法读取路径</div>';
    }
  }

  function escapeHtml(s) {
    const div = document.createElement('div');
    div.textContent = s;
    return div.innerHTML;
  }

  let ppDebounce = null;
  function ppInit(inputEl, dropdown, browseBtn) {
    // Browse button click
    browseBtn.addEventListener('click', (e) => {
      e.preventDefault();
      if (dropdown.classList.contains('open')) {
        dropdown.classList.remove('open');
      } else {
        ppOpen(inputEl, dropdown, inputEl.value || '');
      }
    });

    // Input typing with debounce
    inputEl.addEventListener('input', () => {
      clearTimeout(ppDebounce);
      ppDebounce = setTimeout(() => {
        const val = inputEl.value.trim();
        if (val.length > 0 && (val.startsWith('/') || val.startsWith('~') || val.includes('/'))) {
          ppOpen(inputEl, dropdown, val);
        }
      }, 350);
    });

    // Keyboard navigation
    inputEl.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowDown' && dropdown.classList.contains('open')) {
        e.preventDefault();
        const items = dropdown.querySelectorAll('.pp-item, .pp-current');
        if (items.length > 0) items[0].focus();
      }
      if (e.key === 'Escape') {
        dropdown.classList.remove('open');
      }
    });

    // Close on outside click
    document.addEventListener('click', (e) => {
      if (!inputEl.contains(e.target) && !dropdown.contains(e.target) && !browseBtn.contains(e.target)) {
        dropdown.classList.remove('open');
      }
    });
  }

  // Initialize all path pickers
  document.querySelectorAll('.path-picker').forEach(pp => {
    const input = pp.querySelector('input');
    const dropdown = pp.querySelector('.pp-dropdown');
    const btn = pp.querySelector('.pp-btn');
    if (input && dropdown && btn) {
      ppInit(input, dropdown, btn);
    }
  });
</script>
</body>
